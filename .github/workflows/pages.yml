name: GitHub Pages

# Publie le site à chaque fusion sur main (ou à la demande depuis l'onglet Actions).
# Pas de nouvelle publication quand seuls les tests ou la documentation du dépôt changent : le site serait le même.
on:
  push:
    branches: [main]
    paths-ignore:
      - "tests/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "src/test/**"
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages n'est pas disponible pour un dépôt privé avec un compte gratuit :
    # la publication ne se fait que si le dépôt est public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique, pour le numéro de build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Le site est servi sous https://<compte>.github.io/<dépôt>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
